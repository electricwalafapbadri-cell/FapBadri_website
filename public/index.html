<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>FapBadri</title>
    <meta name="description" content="FapBadri — premium curtain rods, finials, brackets, rings, tracks and accessories. Wholesale & B2B supply, trusted seller on Amazon, Flipkart & Meesho." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c4161c" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="FapBadri — Future Ready Furnishing" />
    <meta property="og:description" content="Premium curtain rods & accessories. Wholesale & corporate supply solutions. Shop now or request a B2B quote." />
    <meta property="og:image" content="%PUBLIC_URL%/social-preview.png" />
    <meta property="og:url" content="https://www.fapbadri.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FapBadri — Future Ready Furnishing" />
    <meta name="twitter:description" content="Premium curtain rods & accessories. Wholesale & corporate supply solutions." />
    <meta name="twitter:image" content="%PUBLIC_URL%/social-preview.png" />

    <!-- Favicon & App Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Logo for pinned tabs (optional) -->
    <link rel="mask-icon" href="%PUBLIC_URL%/logo.svg" color="#c4161c" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

    <!-- Bootstrap CSS (latest stable CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1CmrxMRARb6aLqgBO7yyAxTOQE2AKb9GfXnE1f0lJ6Qv2v6u2l5qXg2kQ5zG3p1y"
      crossorigin="anonymous"
    />

    <!-- App-level CSS (bundled by React build) -->
    <!-- The CRA build will replace /static/css/... automatically. In dev, main.css and App.css are imported in JS. -->
    <!-- Keep this empty or include a minimal fallback style if needed -->

    <!-- Analytics or pixel placeholders (add only when ready) -->
    <!-- <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script> -->

    <!-- Accessibility helpers -->
    <style>
      :root {
        --brand-red: #c4161c;
        --brand-black: #111111;
        --brand-white: #ffffff;
        --max-width: 1280px;
        --radius: 12px;
        font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }

      /* Minimal no-flash baseline so server-generated content looks fine before CSS loads */
      html, body, #root {
        height: 100%;
        margin: 0;
        background: var(--brand-white);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      a { text-decoration: none; color: inherit; }
      img { max-width: 100%; display: block; }
      .visually-hidden { position: absolute !important; height: 1px; width: 1px; overflow: hidden; clip: rect(1px, 1px, 1px, 1px); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <!-- React root -->
    <div id="root"></div>

    <!-- Bootstrap Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-Q3o3m4Q+1qQz3mQ5h1u6sG8m3e4pC9h8kM0b8b1v0x7z9d6f2v1a3m4x9y8z5k7l"
      crossorigin="anonymous"
    ></script>

    <!-- Razorpay Checkout (UI only) -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Optional: small inline script to expose environment or runtime flags (safe) -->
    <script>
      // A tiny runtime config object you can read from client code if needed.
      // DO NOT place secrets here. Only non-sensitive runtime flags.
      window.__FAPBADRI_RUNTIME__ = {
        brand: 'FapBadri',
        env: 'development'
      };
    </script>

    <!-- Production build of React will inject its bundle files here automatically. -->
  </body>
</html>
